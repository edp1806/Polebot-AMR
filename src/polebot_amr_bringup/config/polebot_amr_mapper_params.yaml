# ============================================================
#  SLAM Toolbox — Configuration Robot Physique (RPLidar A1)
#  Mode : online_async SANS odometrie
#  LiDAR : RPLidar A1 -> topic /scan @ 10 Hz
#  TF requis : odom -> base_link  (publie par fake_odom_publisher)
#              base_link -> laser  (static_transform_publisher)
# ============================================================
slam_toolbox:
  ros__parameters:

    # ----- Frames TF -----
    odom_frame:  odom
    map_frame:   map
    base_frame:  base_link
    scan_topic:  /scan

    # ----- Mode scan-only (sans odometrie encodeurs) -----
    # Mettre a 0.0 : SLAM integre CHAQUE scan sans attendre
    # un deplacement confirme par l'odom
    minimum_travel_distance: 0.0   # metres  (defaut: 0.5)
    minimum_travel_heading: 0.0    # radians (defaut: 0.5)
    minimum_time_interval:  0.2    # secondes entre deux keyframes (5 Hz max)

    # Desactiver les contraintes odom dans le graph
    use_odom_graph_constraints: false

    # ----- Scan Matching -----
    use_scan_matching:   true
    use_scan_barycenter: true
    use_laser_scan_for_translation: true

    # ----- Parametres LiDAR (RPLidar A1) -----
    max_laser_range: 12.0          # A1 : portee reelle ~12 m

    # ----- Buffer & Timing (eviter queue is full) -----
    # RPLidar A1 publie a ~10 Hz -> 1 scan toutes les 100 ms
    scan_buffer_size:      20
    max_scan_buffer_size:  40
    transform_timeout:     0.5
    tf_buffer_duration:    30.0
    transform_publish_period: 0.05

    # ----- Resolution de la carte -----
    resolution: 0.05               # 5 cm/pixel

    # ----- Publication -----
    publish_tf: true
    map_update_interval: 2.0

    # ----- Debug -----
    debug_logging: false
    throttle_scans: 1